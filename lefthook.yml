output:
  - summary
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: lint and autocorrect ruby
      run: bundle exec rubocop -a --force-exclusion {staged_files}
      glob: "{*.rb,*.gemspec,Gemfile,Rakefile}"
      stage_fixed: true

    - name: check for conflict markers and whitespace issues
      run: git --no-pager diff --cached --check

    # If tests take >1 second, move this (or just the long-running tests) to pre-push.
    - name: run tests
      run: just test

    - name: spell check
      run: codespell {staged_files}
      glob: "*.{rb,md,gemspec}"

    - name: format markdown
      run: mdformat --wrap no {staged_files}
      glob: "*.md"
      stage_fixed: true

    - name: scan for secrets
      run: detect-secrets-hook --baseline .secrets.baseline {staged_files}
